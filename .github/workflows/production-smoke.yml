name: Production smoke

on:
  workflow_run:
    workflows: ["Skoleverksted CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/production_smoke.py
        env:
          # Optional repository secret. Without it the smoke test still proves
          # that anonymous callers are refused, but skips the signed-in path.
          SMOKE_ACCESS_CODE: ${{ secrets.SMOKE_ACCESS_CODE }}
