name: Skoleverksted CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MateMaTeX/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MateMaTeX/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  platform-backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      TEST_DATA_DIR: ${{ runner.temp }}/skoleverksted-test
      OUTPUT_DIR: ${{ runner.temp }}/skoleverksted-test/output
      SKOLEVERKSTED_DB_PATH: ${{ runner.temp }}/skoleverksted-test/platform.sqlite3
      DATABASE_URL: ''
      GOOGLE_API_KEY: test-key-not-used
      PYTHONPATH: ${{ github.workspace }}
      XDG_DATA_HOME: ${{ runner.temp }}/skoleverksted-test/xdg-data
      CREWAI_DISABLE_TELEMETRY: 'true'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r Skoleverksted/backend/requirements-test.txt
      - run: pytest -q --cov=Skoleverksted/backend/platform --cov-report=term-missing --cov-report=xml:coverage.xml Skoleverksted/backend/tests
      - name: Run cross-module quality evaluation gate
        run: pytest -q Skoleverksted/backend/tests/test_eval_suite.py
      - run: python scripts/compile_sources.py Skoleverksted VGS_KI/backend ScriptoriumFOV/backend MateMaTeX/backend/app
      - run: docker build --check .
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-coverage
          path: coverage.xml
          if-no-files-found: ignore

  deterministic-domain-tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      TEST_DATA_DIR: ${{ runner.temp }}/skoleverksted-test
      OUTPUT_DIR: ${{ runner.temp }}/skoleverksted-test/output
      SKOLEVERKSTED_DB_PATH: ${{ runner.temp }}/skoleverksted-test/platform.sqlite3
      DATABASE_URL: ''
      GOOGLE_API_KEY: test-key-not-used
      PYTHONPATH: ${{ github.workspace }}
      XDG_DATA_HOME: ${{ runner.temp }}/skoleverksted-test/xdg-data
      CREWAI_DISABLE_TELEMETRY: 'true'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r MateMaTeX/backend/requirements.txt
      - run: pytest -q MateMaTeX/backend/tests/test_pipeline.py MateMaTeX/backend/tests/test_math_verifier.py MateMaTeX/backend/tests/test_content_quality.py MateMaTeX/backend/tests/test_text_sanitize.py
        env:
          PYTHONPATH: ${{ github.workspace }}

  full-domain-tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      TEST_DATA_DIR: ${{ runner.temp }}/skoleverksted-test
      OUTPUT_DIR: ${{ runner.temp }}/skoleverksted-test/output
      SKOLEVERKSTED_DB_PATH: ${{ runner.temp }}/skoleverksted-test/platform.sqlite3
      DATABASE_URL: ''
      GOOGLE_API_KEY: test-key-not-used
      XDG_DATA_HOME: ${{ runner.temp }}/skoleverksted-test/xdg-data
      CREWAI_DISABLE_TELEMETRY: 'true'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            VGS_KI/backend/requirements.txt
            ScriptoriumFOV/backend/requirements.txt
            MateMaTeX/backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r Skoleverksted/backend/requirements.txt
      - name: Test Fag & læring
        working-directory: VGS_KI/backend
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests
      - name: Test Norsklæring
        working-directory: ScriptoriumFOV/backend
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests
      - name: Test Matematikk
        working-directory: MateMaTeX/backend
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests
